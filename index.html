<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhammad Afzaal | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
scroll-behavior:smooth;
}

body{
background:#0f172a;
color:white;
}

header{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:rgba(15,23,42,.95);
backdrop-filter:blur(10px);
z-index:1000;
}

.logo{
font-size:24px;
font-weight:700;
color:#38bdf8;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
}

nav a:hover{
color:#38bdf8;
}

.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
gap:60px;
padding:120px 8%;
}

.hero-text{
flex:1;
animation:slideLeft 1s ease;
}

.hero-img{
flex:1;
text-align:center;
animation:slideRight 1s ease;
}

.hero-img img{
width:320px;
height:320px;
object-fit:cover;
border-radius:50%;
border:5px solid #38bdf8;
box-shadow:0 0 30px rgba(56,189,248,.5);
}

.hero h1{
font-size:55px;
}

.typing{
color:#38bdf8;
}

.subtitle{
font-size:20px;
margin-top:15px;
color:#cbd5e1;
}

.description{
margin-top:20px;
line-height:1.8;
color:#cbd5e1;
}

.btn{
display:inline-block;
margin-top:25px;
padding:14px 28px;
background:#38bdf8;
color:black;
font-weight:600;
text-decoration:none;
border-radius:10px;
}

section{
padding:90px 8%;
}

.title{
text-align:center;
font-size:38px;
margin-bottom:35px;
color:#38bdf8;
}
.about{
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
align-items:center;
}

.about img{
width:100%;
border-radius:20px;
}

.about-card,
.skill,
.contact-box{
background:#1e293b;
padding:25px;
border-radius:18px;
}

.skills{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.skill{
text-align:center;
transition:.3s;
}

.skill:hover{
transform:translateY(-8px);
}

.contact{
max-width:700px;
margin:auto;
}

input,textarea{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:10px;
background:#334155;
color:white;
}
